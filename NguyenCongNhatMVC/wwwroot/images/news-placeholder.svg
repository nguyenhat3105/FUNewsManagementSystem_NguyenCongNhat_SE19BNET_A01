<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="0.5" opacity="0.5"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Newspaper icon -->
  <g transform="translate(350, 155)">
    <!-- Page outline -->
    <rect x="0" y="0" width="100" height="130" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Header block -->
    <rect x="12" y="14" width="76" height="10" rx="3" fill="url(#icon)" opacity="0.35"/>

    <!-- Image area -->
    <rect x="12" y="32" width="76" height="44" rx="4" fill="#e2e8f0"/>
    <!-- Mountain in image -->
    <polygon points="12,76 36,48 60,68 76,54 88,76" fill="#94a3b8" opacity="0.5"/>
    <!-- Sun in image -->
    <circle cx="76" cy="42" r="7" fill="#94a3b8" opacity="0.4"/>

    <!-- Text lines -->
    <rect x="12" y="84" width="76" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="12" y="96" width="60" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="12" y="108" width="70" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="12" y="120" width="44" height="6" rx="3" fill="#cbd5e1"/>

    <!-- Fold corner -->
    <path d="M82 0 L100 18 L82 18 Z" fill="#e2e8f0"/>
    <path d="M82 0 L82 18 L100 18" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Label -->
  <text x="400" y="322" text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="15" font-weight="600"
        fill="#94a3b8" letter-spacing="0.5">
    No image available
  </text>
</svg>
